name = "trakt-lubelski"
main = "src/index.js"
compatibility_date = "2024-11-06"
workers_dev = true

# Don't wipe dashboard-set vars/secrets (e.g. TG_BOT_TOKEN) on git deploys.
keep_vars = true

# Per-chat settings + daily-reminder dedup live here (set up in the dashboard).
[[kv_namespaces]]
binding = "STATE"
id = "89f82eb750934738a8506e8278719624"

# Reminders twice a day at 09:00 and 19:00 Warsaw. Cron is UTC; the pairs
# 07/08 (morning) and 17/18 (evening) cover both across DST — the worker checks
# the local hour and sends each slot once per day.
[triggers]
crons = ["0 7,8,17,18 * * *"]
