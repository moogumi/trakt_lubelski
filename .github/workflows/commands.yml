name: Waste bot commands

# Polls Telegram for incoming commands/button taps and answers them, then
# persists state.json (chat settings + getUpdates offset) back to the repo.
# GitHub Actions cron minimum is 5 minutes, so replies arrive within ~5 min.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  # shared with poll.yml so the two never push state.json at the same time
  group: trakt-musor
  cancel-in-progress: false

permissions:
  contents: write  # commit state.json back

jobs:
  commands:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Process pending commands
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PYTHONIOENCODING: "utf-8"
        run: python bot.py --once
      - name: Persist state back to the repo
        if: always()
        run: |
          git config user.name "trakt-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          if git diff --staged --quiet; then
            echo "no state change"
          else
            git commit -m "state: $(date -u +%FT%TZ)"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
          fi
