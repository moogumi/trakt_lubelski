name: Waste TRAKT LUBELSKI

# Cloud run (after local testing). Token and chat_id live in repo Secrets:
#   Settings -> Secrets and variables -> Actions:  TG_BOT_TOKEN, TG_CHAT_ID
on:
  schedule:
    # Every 5 minutes — the smallest interval GitHub Actions allows
    # (cron cannot do every 2 minutes; use start_monitor.bat locally for that).
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: trakt-musor
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Poll schedule and notify
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PYTHONIOENCODING: "utf-8"
        run: python monitor.py --send
