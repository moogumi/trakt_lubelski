name: Музор TRAKT LUBELSKI

# Для облачного запуска (после теста). Токен и chat_id — в Secrets репозитория:
#   Settings -> Secrets and variables -> Actions:  TG_BOT_TOKEN, TG_CHAT_ID
on:
  schedule:
    # ТЕСТ: каждые 5 минут — это минимально допустимый интервал в GitHub Actions
    # (каждые 2 минуты cron в Actions не поддерживает; локально используем start_monitor.bat).
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: trakt-musor
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Опрос графика + уведомление
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PYTHONIOENCODING: "utf-8"
        run: python monitor.py --send
