name: Waste TRAKT LUBELSKI

# Cloud run (after local testing). Token and chat_id live in repo Secrets:
#   Settings -> Secrets and variables -> Actions:  TG_BOT_TOKEN, TG_CHAT_ID
on:
  schedule:
    # Daily reminder about the next day's pickups.
    # 17:00 UTC = 19:00 Warsaw (CEST). Adjust if needed.
    - cron: "0 17 * * *"
  workflow_dispatch:  # manual "Run workflow" button for testing

concurrency:
  group: trakt-musor
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Poll schedule and notify
        # Uses config.txt (notify_scope=due, notify_days_before=1, lang=pl).
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PYTHONIOENCODING: "utf-8"
        run: python monitor.py --send
