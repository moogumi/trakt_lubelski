name: Waste bot (interactive)

# Long-running interactive bot, siren-style: one job runs the long-poll loop for
# ~50 minutes, and cron restarts it every 15 minutes. A concurrency lock keeps a
# fresh run pending until the current one ends -> near-continuous coverage, so
# button taps get answered within seconds. Free on public repos (unlimited minutes).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: trakt-bot-loop
  cancel-in-progress: false  # let the running 50-min job finish; queue the next

permissions:
  contents: write  # commit state.json (chat settings + getUpdates offset) back

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run interactive bot (~50 min loop)
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PYTHONIOENCODING: "utf-8"
          LOOP_MINUTES: "50"
        run: python bot.py
      - name: Persist state back to the repo
        if: always()
        run: |
          git config user.name "trakt-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          if git diff --staged --quiet; then
            echo "no state change"
          else
            git commit -m "state: $(date -u +%FT%TZ)"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
          fi
