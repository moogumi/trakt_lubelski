name: Waste send now (manual)

# Manual "send the reminder right now" button. Sends to every subscriber with
# their own language + scope/days settings (same output as the daily reminder),
# but triggered on demand. Does not call getUpdates, so it never conflicts with
# the always-on interactive bot.
on:
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send reminder now
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PYTHONIOENCODING: "utf-8"
        run: python monitor.py --send
